services:
  neo_font.settings:
    parent: neo_settings.repository
    arguments: ['neo_font']

  logger.channel.neo_font:
    parent: logger.channel_base
    arguments: ['neo_font']

  plugin.manager.neo_font:
    class: Drupal\neo_font\FontPluginManager
    arguments: ['%app.root%', '@module_handler', '@theme_handler', '@file_system', '@file_url_generator', '@cache.discovery', '@logger.channel.neo_font']

  neo_font.role_resolver:
    class: Drupal\neo_font\FontRoleResolver
    arguments: ['@plugin.manager.neo_font', '@neo_font.settings']

  neo_font.neo_build_declaration_event_subscriber:
    class: '\Drupal\neo_font\EventSubscriber\NeoBuildDeclarationEventSubscriber'
    arguments: ['@plugin.manager.neo_font']
    tags:
      - { name: 'event_subscriber' }

  neo_font.neo_build_event_subscriber:
    class: '\Drupal\neo_font\EventSubscriber\NeoBuildEventSubscriber'
    arguments: ['@neo_font.role_resolver']
    tags:
      - { name: 'event_subscriber' }

  neo_font.neo_build_inline_event_subscriber:
    class: '\Drupal\neo_font\EventSubscriber\NeoBuildInlineEventSubscriber'
    arguments: ['@neo_font.role_resolver']
    tags:
      - { name: 'event_subscriber' }
