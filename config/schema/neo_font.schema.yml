neo_font.settings:
  type: neo_font
  mapping:
    _core:
      # Added by the config installer; only exists for merging config.
      requiredKey: false
      type: _core_config_info

# Required by neo_settings.schema.yml, which resolves a variation's stored
# settings via `type: neo_settings.settings.[%parent.plugin]`.
neo_settings.settings.neo_font:
  type: neo_font

neo_font:
  type: mapping
  mapping:
    primary:
      type: string
      label: Primary
    secondary:
      type: string
      label: Secondary
    accent:
      type: string
      label: Accent
    heading:
      type: string
      label: Heading
    ui:
      type: string
      label: User Interface
